name: mercado-global

networks:
  backend:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: mercado-global-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - backend

  localstack:
    image: localstack/localstack:3.8
    container_name: mercado-global-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,cloudformation,s3,ssm,sts,iam
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - "./docker/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
